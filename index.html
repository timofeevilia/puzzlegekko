<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Land</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@400;600;800&family=Noto+Sans+Thai:wght@500&family=Noto+Sans+Myanmar:wght@500&display=swap">
<style>
/* Layout: a lacquerware board (13-unit grid, saa-paper cells, all text upright) on the left; a teak control panel on the right with the turn actions first. Stacks on phones. */
:root{
  --lacquer:#1b0f0c;      /* page ground, black lacquer */
  --lacquer-2:#2a1712;    /* raised panels */
  --vermilion:#9e2a1f;    /* board centre */
  --gold:#e6b44c;         /* gold leaf accent */
  --gold-soft:#c99a3c;
  --paper:#f4e8cf;        /* saa paper cells */
  --paper-ink:#2b1b12;
  --ink:#f6ead2;          /* text on lacquer */
  --ink-dim:#c8b597;
  --line:rgba(230,180,76,.28);
  --good:#7fd17a; --bad:#ff7a6b;
  --display:"Yeseva One", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --thai:"Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --mm:"Noto Sans Myanmar", "Myanmar Text", "Padauk", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--lacquer);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(158,42,31,.35), transparent 60%),
    radial-gradient(900px 500px at 110% 110%, rgba(230,180,76,.12), transparent 60%),
    var(--lacquer);
  min-height:100%;}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}

/* ---------- board ---------- */
.board-wrap{position:relative;width:100%;max-width:min(1000px, calc(100vh - 32px));margin:0 auto}
@media (max-width:980px){.board-wrap{max-width:100%}}
.board{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;display:grid;
  grid-template-columns:2fr repeat(9,1fr) 2fr;grid-template-rows:2fr repeat(9,1fr) 2fr;
  gap:2px;padding:2px;background:linear-gradient(135deg,#7a5a22,var(--gold),#7a5a22);border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.15);container-type:inline-size}
.cell{position:relative;background:var(--paper);color:var(--paper-ink);overflow:hidden;display:flex;cursor:pointer;
  border:none;padding:0;text-align:center;min-width:0;min-height:0;transition:filter .15s}
.cell:hover{filter:brightness(1.06)}
.side-bottom{flex-direction:column}
.side-top{flex-direction:column-reverse}
.side-left{flex-direction:row-reverse}
.side-right{flex-direction:row}
.cell.corner{flex-direction:column}
.cell .band{flex:0 0 19%;position:relative}
.cell .nm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 3px;gap:2px;min-height:0;min-width:0}
.side-left .nm,.side-right .nm{flex-direction:row;justify-content:flex-start;text-align:left;gap:.6cqw;padding:2px .7cqw}
.side-left .tx,.side-right .tx{min-width:0}
.side-left .band,.side-right .band{flex-basis:14%}
.side-left .ic,.side-right .ic{font-size:clamp(10px,2.5cqw,26px)}
.cell .t{font-weight:800;font-size:clamp(6px,1.32cqw,13.5px);line-height:1.08;overflow-wrap:anywhere;hyphens:auto}
.cell .loc{font-size:clamp(6px,1.1cqw,11px);line-height:1.1;opacity:.75}
.cell .pr{font-size:clamp(6px,1.2cqw,12px);font-weight:800;font-variant-numeric:tabular-nums;color:#7a3b16;margin-top:1px}
.cell .ic{font-size:clamp(11px,3.3cqw,32px);line-height:1;flex:none}
.cell.corner .ic{font-size:clamp(18px,6.2cqw,58px)}
.cell.corner .t{font-size:clamp(7px,1.6cqw,16px)}
.cell .flag{position:absolute;width:clamp(7px,1.5cqw,15px);aspect-ratio:3/2;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
.side-bottom .flag,.side-right .flag{right:3px;bottom:5px}
.side-top .flag,.side-left .flag{left:3px;top:5px}
.flag.TH{background:linear-gradient(#a51931 0 16.6%,#f4f5f8 16.6% 33.3%,#2d2a4a 33.3% 66.6%,#f4f5f8 66.6% 83.3%,#a51931 83.3%)}
.flag.MM{background:linear-gradient(#fecb00 0 33.3%,#34b233 33.3% 66.6%,#ea2839 66.6%)}
.cell .own{position:absolute;pointer-events:none}
.side-bottom .own{inset:auto 0 0 0;height:clamp(3px,.7cqw,7px)}
.side-top .own{inset:0 0 auto 0;height:clamp(3px,.7cqw,7px)}
.side-left .own{inset:0 auto 0 0;width:clamp(3px,.7cqw,7px)}
.side-right .own{inset:0 0 0 auto;width:clamp(3px,.7cqw,7px)}
.cell .mort{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(40,20,10,.45) 0 4px,transparent 4px 9px);pointer-events:none}
.cell .huts{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px}
.side-left .huts,.side-right .huts{flex-direction:column}
.hut{width:clamp(4px,1.05cqw,10px);aspect-ratio:1;background:#fff;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.resort{width:clamp(9px,2.1cqw,20px);aspect-ratio:1.3;background:#fff6dc;clip-path:polygon(50% 0,80% 30%,70% 30%,95% 60%,85% 60%,100% 100%,0 100%,15% 60%,5% 60%,30% 30%,20% 30%)}
.cell.hl{box-shadow:inset 0 0 0 3px var(--gold)}
.cell.can-build::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #ffd76a;animation:glow 1.6s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px rgba(255,215,106,.15)}}

.center{grid-column:2/11;grid-row:2/11;position:relative;border-radius:4px;overflow:hidden;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%, rgba(230,180,76,.07) 0 6deg, transparent 6deg 12deg),
    radial-gradient(circle at 50% 50%, #b8382a 0, var(--vermilion) 45%, #5c140e 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5cqw,16px);padding:3cqw}
.center::before{content:"";position:absolute;inset:3%;border:1px solid rgba(230,180,76,.5);border-radius:50%;pointer-events:none}
.center::after{content:"";position:absolute;inset:7%;border:1px dashed rgba(230,180,76,.3);border-radius:50%;pointer-events:none}
.logo{text-align:center;position:relative;z-index:1}
.logo h1{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;font-size:clamp(20px,6cqw,60px);line-height:.95;letter-spacing:.01em;text-shadow:0 2px 0 #4a0f08,0 0 24px rgba(230,180,76,.35)}
.logo .sub{font-size:clamp(7px,1.4cqw,13px);letter-spacing:.32em;text-transform:uppercase;color:#f3d79a;margin-top:.4em}
.logo .scripts{font-size:clamp(8px,1.6cqw,15px);color:#f3d79a;opacity:.85;margin-top:.2em}
.mm{font-family:var(--mm)} .th{font-family:var(--thai)}
.season{position:relative;z-index:1;font-size:clamp(8px,1.4cqw,13px);letter-spacing:.12em;text-transform:uppercase;color:#ffe6a8;background:rgba(0,0,0,.25);border:1px solid rgba(230,180,76,.4);border-radius:999px;padding:.25em .9em}
.status{position:relative;z-index:1;text-align:center;font-size:clamp(10px,1.8cqw,17px);color:#fff4dc;min-height:1.4em;max-width:90%}
.status b{color:var(--gold)}
.actions{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:clamp(4px,1cqw,10px);justify-content:center}
.btn{border:none;border-radius:999px;padding:.6em 1.25em;font-weight:800;letter-spacing:.02em;font-size:15px;
  background:linear-gradient(180deg,#f7d27a,var(--gold) 55%,#b8862c);color:#3a1a06;box-shadow:0 3px 0 #6d4512,0 6px 18px rgba(0,0,0,.35);transition:transform .08s}
.center .btn{font-size:clamp(11px,1.7cqw,16px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6d4512}
.btn.ghost{background:rgba(255,240,210,.1);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(230,180,76,.5)}
.btn.danger{background:linear-gradient(180deg,#ff9b8a,#e0523f);color:#2a0703;box-shadow:0 3px 0 #6d1d12}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:.42em .85em;box-shadow:0 2px 0 #6d4512}
.btn.sm.ghost{box-shadow:inset 0 0 0 1px rgba(230,180,76,.5)}

/* dice */
.dice{display:flex;gap:clamp(8px,2.4cqw,22px);position:relative;z-index:1;perspective:600px}
.die{--s:clamp(28px,6.6cqw,64px);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,#fffaf0,#efe0c0);border-radius:18%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 -3px 6px rgba(0,0,0,.12);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%}
.face i{width:72%;aspect-ratio:1;border-radius:50%;background:#7a1810;place-self:center;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.face.f1 i{background:#c8322b}
.f1{transform:translateZ(calc(var(--s)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.die.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-3px -6px}50%{translate:3px 0}75%{translate:-2px -4px}}

/* tokens */
.tokens{position:absolute;inset:0;pointer-events:none}
.token{--ts:clamp(18px,4.4cqw,42px);position:absolute;width:var(--ts);height:var(--ts);margin:calc(var(--ts)/-2) 0 0 calc(var(--ts)/-2);
  border-radius:50%;display:grid;place-items:center;font-size:calc(var(--ts)*.58);
  background:radial-gradient(circle at 35% 30%,#fff7e0,var(--c) 70%);box-shadow:0 0 0 2px #2b1408,0 4px 10px rgba(0,0,0,.55);
  transition:left .16s ease-out, top .16s ease-out;z-index:3}
.token.hop{animation:hop .16s ease-out}
.token.turn::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c);animation:pulse 1.4s infinite}
@keyframes hop{50%{translate:0 -35%}}
@keyframes pulse{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.float{position:absolute;font-size:clamp(22px,6cqw,48px);pointer-events:none;z-index:20;animation:floatup 2.4s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(20px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-200px) scale(1)}}

/* ---------- side panel ---------- */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:linear-gradient(180deg,var(--lacquer-2),#1f110d);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 10px;color:var(--gold);letter-spacing:.01em}
.card.turn{border-color:rgba(230,180,76,.6);box-shadow:0 0 0 1px rgba(230,180,76,.15),0 12px 40px rgba(0,0,0,.35)}
.turn-status{font-size:15px;margin-bottom:10px}
.turn-status b{color:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 10px;background:rgba(0,0,0,.25);border-radius:12px;padding:4px}
.tabs button{border:none;background:transparent;color:var(--ink-dim);font-weight:800;font-size:12.5px;padding:8px 2px;border-radius:9px;position:relative}
.tabs button[aria-selected="true"]{background:rgba(230,180,76,.18);color:var(--gold)}
.tabs .badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:8px;background:#e8392b;color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.tabpane{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,240,210,.04);border:1px solid rgba(230,180,76,.12)}
.item .sw{width:10px;height:30px;border-radius:3px}
.item .nm2{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub2{font-size:12px;color:var(--ink-dim)}
.item .bts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.note b{color:var(--ink)}
.spark{width:64px;height:24px;display:block}
.chg{font-size:11.5px;font-weight:800}
.chg.up{color:var(--good)} .chg.dn{color:var(--bad)}
.players{display:grid;gap:10px}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,240,210,.04);border:1px solid transparent}
.pl.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.pl .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#fff7e0,var(--c) 70%);box-shadow:0 0 0 2px #2b1408}
.pl .n{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .meta{font-size:12px;color:var(--ink-dim)}
.pl .cash{font-family:var(--display);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.pl .nw{font-size:11px;color:var(--ink-dim);text-align:right;font-family:var(--body)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#665;margin-right:4px;vertical-align:middle}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;grid-column:1/-1}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--g);color:#1a0d06;font-weight:800;border:none}
.chip.m{opacity:.45;text-decoration:line-through}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{background:rgba(255,240,210,.06);border:1px solid var(--line);border-radius:10px;font-size:20px;padding:6px 9px;line-height:1}
.react button:hover{background:rgba(230,180,76,.15)}
.log{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-dim)}
.log div{padding-left:10px;border-left:2px solid var(--line)}
.log div:first-child{color:var(--ink);border-left-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:12px;color:var(--ink-dim)}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,4,2,.68);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.7);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.modal.dark{background:linear-gradient(180deg,var(--lacquer-2),#1a0e0a);color:var(--ink);border:1px solid var(--line)}
.deed-h{padding:16px 18px 14px;text-align:center;color:#1a0d06;position:relative}
.deed-h .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.deed-h h3{font-family:var(--display);font-weight:400;font-size:26px;margin:4px 0 2px;line-height:1.05;text-wrap:balance}
.deed-h .lc{font-size:17px}
.lc.TH{font-family:var(--thai)} .lc.MM{font-family:var(--mm)}
.deed-b{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.blurb{font-size:13.5px;line-height:1.5}
.rent{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rent td{padding:3px 0;border-bottom:1px dashed rgba(43,27,18,.2)}
.rent td:last-child{text-align:right;font-weight:800}
.rent tr.cur td{color:#9e2a1f}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modal .btn.ghost{color:var(--paper-ink);background:rgba(43,27,18,.08);box-shadow:inset 0 0 0 1px rgba(43,27,18,.3)}
.modal.dark .btn.ghost{color:var(--ink);background:rgba(255,240,210,.08);box-shadow:inset 0 0 0 1px rgba(230,180,76,.5)}
.fortune{padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.fortune .big{font-size:54px;line-height:1}
.fortune h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:#9e2a1f}
.fortune p{margin:0;font-size:16px;line-height:1.45;text-wrap:balance}
.hint{font-size:13px;background:rgba(43,27,18,.07);border-radius:10px;padding:10px 12px;text-align:left;width:100%}

/* mini-games */
.quiz-q{font-size:30px;line-height:1.3;padding:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opts button{border:1px solid rgba(43,27,18,.25);background:#fffaf0;color:var(--paper-ink);border-radius:12px;padding:10px 8px;font-weight:800}
.opts button.ok{background:#bfe8b5;border-color:#4b9a3f}
.opts button.no{background:#f6c0b6;border-color:#c24a37}
.track{position:relative;width:100%;height:46px;border-radius:23px;background:linear-gradient(90deg,#e9d7b2,#f7ecd4,#e9d7b2);box-shadow:inset 0 2px 6px rgba(0,0,0,.2);overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:rgba(47,154,98,.45);border-left:2px solid #2f9a62;border-right:2px solid #2f9a62}
.track .ball{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:repeating-conic-gradient(#b07a2e 0 20deg,#e8c27a 20deg 40deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mines{display:flex;gap:12px;justify-content:center}
.mines button{width:84px;height:96px;border-radius:14px;border:2px solid #6b4a2e;background:linear-gradient(#5a3a22,#2b1a10);color:#fff;font-size:36px;display:grid;place-items:center}
.mines button.rv{background:linear-gradient(#f7ecd4,#e2cfa6);color:var(--paper-ink);font-size:13px;font-weight:800}
.mines button.rv span{font-size:34px;display:block}

/* setup */
.setup{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{text-align:center;padding:28px 0 6px}
.hero h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(44px,10vw,92px);margin:0;line-height:.9;text-shadow:0 3px 0 #4a0f08}
.hero .sub{letter-spacing:.3em;text-transform:uppercase;color:#f3d79a;font-size:12px;margin-top:10px}
.hero .scripts{margin-top:8px;color:var(--ink-dim);font-size:16px}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.seats{grid-template-columns:minmax(0,1fr)}}
.seat{display:flex;flex-direction:column;gap:12px}
.seat input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px}
.tokpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tokpick button{font-size:24px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:rgba(255,240,210,.04);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.tokpick button span{font-size:10px;color:var(--ink-dim)}
.tokpick button[aria-pressed="true"]{background:rgba(230,180,76,.2);border-color:var(--gold)}

function tone(f,d=.08,type="sine",v=.06,delay=0){
  if(!soundOn)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();

/* ================= GAME RULES (pure state transforms) ================= */
function newGame(seats){
  const mk={};ASSETS.forEach(a=>mk[a.k]={p:a.p0,h:[a.p0]});
  return {v:2,started:Date.now(),turn:0,first:0,round:1,phase:"roll",dbl:0,pot:0,didBuyout:false,

    own:{},mk,mg:4+(Math.random()*3|0),mini:null,
    decks:{fortune:shuffle(CARDS.fortune.map((_,i)=>i)),merit:shuffle(CARDS.merit.map((_,i)=>i))},di:{fortune:0,merit:0},

function L(s,msg){s.log.push(msg);if(s.log.length>60)s.log.splice(0,s.log.length-60)}
function groupOf(g){return B.map((b,i)=>i).filter(i=>B[i].t==="prop"&&B[i].g===g)}
function ownsAll(s,p,g){return groupOf(g).every(i=>s.own[i]&&s.own[i].o===p)}
function countType(s,p,t){return B.map((b,i)=>i).filter(i=>B[i].t===t&&s.own[i]&&s.own[i].o===p).length}
function season(s){let c=SEASONS[0];for(const x of SEASONS)if((s.round||1)>=x.r)c=x;return c}
function rentFor(s,i,dice,mult){
  const o=s.own[i];if(!o||o.m)return 0;const b=B[i];let r=0;
  if(b.t==="prop")r=o.h>0?b.rent[o.h]:b.rent[0]*(ownsAll(s,o.o,b.g)?2:1);
  else if(b.t==="rail"){const n=countType(s,o.o,"rail");r=25*2**(n-1)*(mult||1)}
  else if(b.t==="util"){const n=countType(s,o.o,"util");r=dice*(mult===10?10:(n===2?10:4))}
  const m=season(s).m;return m===1?r:Math.round(r*m)}
function pay(s,from,to,amt){s.players[from].cash-=amt;if(to!=null)s.players[to].cash+=amt}
function stockValue(s,p){const pl=s.players[p];return ASSETS.reduce((v,a)=>v+(pl.sh[a.k]||0)*s.mk[a.k].p,0)}
function netWorth(s,p){const pl=s.players[p];let w=pl.cash+Math.round(stockValue(s,p))-(pl.loan||0);
  for(const k in s.own){const o=s.own[k];if(o.o!==p)continue;const b=B[k];w+=o.m?b.price/2:b.price;if(o.h)w+=o.h*G[b.g].h}return w}

function passGo(s,p,ev){const pl=s.players[p];pl.cash+=200;let m=`${pl.name} passed Mingalaba! +฿200`;
  const div=Math.round((pl.sh.set||0)*s.mk.set.p*.04);if(div){pl.cash+=div;m+=` · SET dividend +฿${div}`}
  if(pl.loan){const int=Math.max(10,Math.round(pl.loan*LOAN_RATE/10)*10);pl.cash-=int;m+=` · loan interest −฿${int}`}
  ev.msgs.push(m)}
// walk forward n squares, recording steps for animation
function walk(s,p,n,ev){const pl=s.players[p];for(let k=0;k<n;k++){pl.pos=(pl.pos+1)%40;ev.steps.push(pl.pos);if(pl.pos===0)passGo(s,p,ev)}}
function walkTo(s,p,dest,ev){const pl=s.players[p];walk(s,p,(dest-pl.pos+40)%40,ev)}
function toJail(s,p,ev){const pl=s.players[p];pl.pos=10;pl.jail=1;s.dbl=0;ev.steps.push({jump:10});ev.jailed=1;L(s,pl.name+" was sent on a Visa Run.")}

function land(s,p,dice,ev,mult){
  const pl=s.players[p],i=pl.pos,b=B[i];
  if(buyable(i)){
    const o=s.own[i];
    if(!o){s.phase="buy";return}
    if(o.o===p||o.m)return;
    const r=rentFor(s,i,dice,mult);pay(s,p,o.o,r);
    ev.msgs.push(`${pl.name} paid ${money(r)} to ${s.players[o.o].name} at ${b.name}`);L(s,`${pl.name} paid ${money(r)} rent at ${b.name}.`);ev.pay=1;return}
  if(b.t==="tax"){pay(s,p,null,b.amt);s.pot+=b.amt;ev.msgs.push(`${pl.name}: ${b.name}, −${money(b.amt)} into the festival pot`);L(s,`${pl.name} paid ${money(b.amt)} (${b.name}).`);ev.pay=1;return}
  if(b.t==="park"){if(s.pot>0){pl.cash+=s.pot;ev.msgs.push(`💦 ${pl.name} splashed out the festival pot: +${money(s.pot)}`);L(s,`${pl.name} collected the Water Festival pot of ${money(s.pot)}.`);s.pot=0;ev.coin=1}return}
  if(b.t==="gojail"){toJail(s,p,ev);return}
  if(b.t==="fortune"||b.t==="merit"){drawCard(s,p,b.t,dice,ev);return}
}
function drawCard(s,p,deck,dice,ev){
  const idx=s.decks[deck][s.di[deck]%s.decks[deck].length];s.di[deck]++;
  const c=CARDS[deck][idx],pl=s.players[p],other=1-p;
  ev.card={deck,idx};L(s,`${pl.name} drew: ${c.x}`);
  if(c.cash){pl.cash+=c.cash;if(c.cash<0)s.pot+=-c.cash}
  if(c.payOther)pay(s,p,other,c.payOther);
  if(c.getOther)pay(s,other,p,c.getOther);
  if(c.goj)pl.goj++;
  if(c.repairs){let n=0;for(const k in s.own){const o=s.own[k];if(o.o===p&&o.h)n+=o.h===5?c.repairs[1]:o.h*c.repairs[0]}pl.cash-=n;s.pot+=n;if(n)ev.msgs.push(`${pl.name} paid ${money(n)} for repairs`)}
  if(c.jail){toJail(s,p,ev);return}
  if(c.challenge){s.challenge={p,q:Math.random()*CHALLENGES.length|0};s.phase="challenge";return}
  if(c.back){pl.pos=(pl.pos-c.back+40)%40;ev.steps.push({jump:pl.pos});land(s,p,dice,ev);return}
  if(c.moveTo!=null){walkTo(s,p,c.moveTo,ev);land(s,p,dice,ev);return}
  if(c.near){let k=pl.pos;do{k=(k+1)%40}while(B[k].t!==c.near);walkTo(s,p,k,ev);land(s,p,dice,ev,c.near==="util"?10:2);return}
}

  else if(a==="deedbuy"){openSheet={k:"deed",i:S.players[S.turn].pos};renderSheets()}

  else if(a==="mini"){openSheet={k:"mini"};renderSheets()}
  else if(a==="trade"){openSheet={k:"trade"};renderSheets()}
  else if(a==="deed"){openSheet={k:"deed",i:+arg};renderSheets()}
  else if(["build","sell","mort","unmort"].includes(a)){commit(s=>doManage(s,+arg,a));if(a==="build")sfx.coin()}
  else if(a==="buyout"){const i=+arg;openSheet={k:"confirm",msg:`Buy out ${B[i].name} from ${S.players[S.own[i].o].name} for ${money(buyoutPrice(i))}? They can't refuse, and they get the money.`,go:()=>{commit(s=>doBuyout(s,i));sfx.coin();floatEmoji("💥")}};renderSheets()}
  else if(a==="loan")commit(s=>doLoan(s,+arg));

  else if(a==="stock"){const [k,n]=arg.split(":");commit(s=>doStock(s,k,+n));sfx.coin()}
  else if(a==="bankrupt"){openSheet={k:"confirm",msg:"Declare bankruptcy and end the game?",go:()=>commit(s=>doBankrupt(s,s.turn))};renderSheets()}
  else if(a==="new"){openSheet={k:"confirm",msg:"Start a new game? The current board will be cleared.",go:resetGame};renderSheets()}

}

async function runEvent(ev){
  animating=true;seen=ev.seq;const p=ev.who;
  anim={};anim[p]=ev.from;render();
  await sleep(30);
  document.querySelectorAll(".die").forEach(d=>d.classList.add("shake"));sfx.dice();
  setDice(ev.dice,true);prevDice=ev.dice;await sleep(950);
  for(const st of ev.steps){
    if(typeof st==="object"){await sleep(250);anim[p]=st.jump;placeTokens();sfx.gong();await sleep(450)}
    else{anim[p]=st;placeTokens();const t=document.querySelector(`.token[data-p="${p}"]`);if(t){t.classList.remove("hop");void t.offsetWidth;t.classList.add("hop")}sfx.step();await sleep(170)}}
  anim=null;animating=false;if(!S){render();return}
  const pos=S.players[p].pos;
  render();const cell=document.querySelector(`.cell[data-i="${pos}"]`);if(cell)cell.classList.add("hl");
  ev.msgs.forEach(m=>toast(m));
  if(ev.pay)sfx.pay();if(ev.coin)sfx.coin();
  if(ev.card){sfx.card();openSheet={k:"card",deck:ev.card.deck,idx:ev.card.idx,who:p};renderSheets()}
  else if(S.phase==="buy"&&isMyTurn()){openSheet={k:"deed",i:pos};renderSheets()}
  if(S.ev.seq>seen)runEvent(S.ev);
}

  if(m.kind==="quiz"){const q=B[m.q];const pick=mg&&mg.pick;
    body=`<div class="quiz-q ${q.c==="TH"?"th":"mm"}">${q.lc}</div><div class="opts">${m.opts.map(i=>`<button data-s="qpick" data-i="${i}" class="${pick!=null?(i===m.q?"ok":i===pick?"no":""):""}" ${pick!=null?"disabled":""}>${esc(B[i].name)}</button>`).join("")}</div>
      ${pick!=null?`<p>${pick===m.q?"Correct! +฿100":"Not quite. It was "+esc(q.name)+"."}</p><button class="btn" data-s="mdone" data-amt="${pick===m.q?100:0}" data-txt="${pick===m.q?"named "+esc(q.name)+" correctly":"missed the place quiz"}">Continue</button>`:""}`}
  if(m.kind==="chin"){const done=mg&&mg.kicks>=3;
    body=`<div class="track" id="trk"><div class="zone" id="zn"></div><div class="ball" id="bl"></div></div>
      <p id="chmsg">${mg?`Kick ${Math.min(mg.kicks+1,3)} of 3 · hits: ${mg.hits}`:"Kick 1 of 3"}</p>
      ${done?`<button class="btn" data-s="mdone" data-amt="${mg.hits*50}" data-txt="kept the chinlone up ${mg.hits} time${mg.hits===1?"":"s"}">Collect ${money(mg.hits*50)}</button>`:`<button class="btn" data-s="kick" style="font-size:18px;padding:.7em 2.2em">Kick!</button>`}`}
  if(m.kind==="ruby"){const pick=mg&&mg.pick;
    body=`<div class="mines">${m.mines.map((v,k)=>pick==null?`<button data-s="dig" data-i="${k}" aria-label="Shaft ${k+1}">⛏️</button>`:`<button class="rv" disabled><span>${v===200?"🔴":v===80?"🟢":"🪨"}</span>${v?money(v):"mud"}</button>`).join("")}</div>
      ${pick!=null?`<p>${m.mines[pick]===200?"A pigeon's-blood ruby!":m.mines[pick]===80?"A piece of jade.":"Only mud this time."}</p><button class="btn" data-s="mdone" data-amt="${m.mines[pick]}" data-txt="${m.mines[pick]===200?"found a ruby in Mogok":m.mines[pick]===80?"found jade in Mogok":"dug up only mud in Mogok"}">Continue</button>`:""}`}
  return `<div class="modal"><div class="fortune"><div class="big">${info.ic}</div><div class="eyebrow" style="color:#7a5a3d">Festival mini-game</div><h3>${info.n}</h3><p style="font-size:14px">${info.x}</p>${body}</div></div>`}
function startChin(){if(!mg||mg.kind!=="chin")mg={kind:"chin",kicks:0,hits:0,t0:performance.now(),zone:newZone(0)};placeZone();mg.live=true;
  const loop=t=>{if(!mg||!mg.live)return;const bl=$("#bl");if(bl){const sp=.55+mg.kicks*.2,ph=((t-mg.t0)/1000*sp)%2,x=ph<1?ph:2-ph;mg.x=x;bl.style.left=(4+x*92)+"%";bl.style.transform=`rotate(${t/3}deg)`}mg.raf=requestAnimationFrame(loop)};
  if(mg.kicks<3)mg.raf=requestAnimationFrame(loop)}
function newZone(k){const w=[.24,.17,.11][k]||.11;return{w,l:.08+Math.random()*(.84-w)}}
function placeZone(){const z=$("#zn");if(z&&mg){z.style.left=(4+mg.zone.l*92)+"%";z.style.width=(mg.zone.w*92)+"%"}}
function stopChin(){if(mg&&mg.raf)cancelAnimationFrame(mg.raf);if(mg)mg.live=false}
function sheetHTML(sh){
  if(sh.k==="deed")return deedHTML(sh.i);
  if(sh.k==="mini")return miniHTML();
  if(sh.k==="card"){const c=CARDS[sh.deck][sh.idx],f=sh.deck==="fortune";
    return `<div class="modal"><div class="fortune"><div class="big">${f?"🎋":"🪷"}</div><div class="eyebrow" style="color:#7a5a3d">${esc(S.players[sh.who].name)} drew</div><h3>${f?"Fortune Stick":"Merit Box"}</h3><p>${esc(c.x)}</p><div class="mbtns" style="justify-content:center"><button class="btn" data-s="close">${c.challenge&&isMyTurn()?"Let's do it":"OK"}</button></div></div></div>`}
  if(sh.k==="chal"){const ch=CHALLENGES[S.challenge?S.challenge.q:0];
    return `<div class="modal"><div class="fortune"><div class="big">💞</div><h3>Language moment</h3><p>${esc(ch.q)}</p>
      <details class="hint"><summary>Show the answer</summary><div style="margin-top:6px">${ch.h}</div></details>
      <p class="small" style="color:#5b4433">Your partner is the judge. Nailed it: you both get ฿50.</p>
      <div class="mbtns" style="justify-content:center"><button class="btn ghost" data-s="chalno">Not this time</button><button class="btn" data-s="chalyes">Nailed it 💞</button></div></div></div>`}
  if(sh.k==="confirm")return `<div class="modal dark"><div class="deed-b"><p style="font-size:16px;margin:6px 0">${esc(sh.msg)}</p><div class="mbtns"><button class="btn ghost" data-s="close">Cancel</button><button class="btn danger" data-s="confirm">Yes</button></div></div></div>`;
  if(sh.k==="trade"){const a=S.turn,b=1-a;const mineT=tradeable(S,a),theirs=tradeable(S,b);
    const list=(arr,name)=>arr.length?arr.map(i=>`<label><input type="checkbox" name="${name}" value="${i}"> <span style="width:8px;height:8px;border-radius:2px;background:${sw(i)}"></span>${esc(B[i].name)}</label>`).join(""):'<span class="small" style="color:#6b5443">Nothing to trade</span>';
    return `<div class="modal"><div class="deed-h" style="background:var(--gold)"><div class="k">Deal with ${esc(S.players[b].name)}</div><h3>Propose a trade</h3></div>
      <div class="deed-b"><div class="tr-cols"><div><div class="eyebrow" style="color:#6b5443">You give</div>${list(mineT,"give")}<input id="tr-gc" type="number" min="0" step="10" placeholder="฿ cash" aria-label="Cash you give"></div>
      <div><div class="eyebrow" style="color:#6b5443">You get</div>${list(theirs,"get")}<input id="tr-tc" type="number" min="0" step="10" placeholder="฿ cash" aria-label="Cash you get"></div></div>
      <p class="small" style="color:#6b5443;margin:0">Places with huts in their group can't be traded.</p>
      <div class="mbtns"><button class="btn ghost" data-s="close">Cancel</button><button class="btn" data-s="sendtrade">Send offer</button></div></div></div>`}
  if(sh.k==="offer"){const t=S.trade;if(!t){openSheet=null;return""}const a=S.players[t.from];
    const ls=(arr,c)=>arr.map(i=>esc(B[i].name)).concat(c?[money(c)]:[]).join(", ")||"nothing";
    return `<div class="modal"><div class="deed-h" style="background:var(--gold)"><div class="k">Offer from ${esc(a.name)}</div><h3>🤝 Trade?</h3></div>
      <div class="deed-b"><p class="blurb" style="margin:0"><b>You get:</b> ${ls(t.give,t.giveCash)}</p><p class="blurb" style="margin:0"><b>You give:</b> ${ls(t.get,t.getCash)}</p>
      <div class="mbtns"><button class="btn ghost" data-s="decline">Decline</button><button class="btn" data-s="accept">Accept</button></div></div></div>`}
  if(sh.k==="rules")return rulesHTML();
  return "";
}
function rulesHTML(){return `<div class="modal dark"><div class="deed-b">
  <h2 style="font-family:var(--display);font-weight:400;color:var(--gold);margin:0">How to play</h2>
  <p class="blurb" style="margin:0">Classic property trading, moved to Thailand and Myanmar. Everything you can do on your turn is in the panel on the right (below the board on a phone).</p>
  <ul class="blurb" style="margin:0;padding-left:18px;display:grid;gap:4px">
   <li>Everyone starts with ฿1,500. Passing <b>Mingalaba!</b> pays ฿200.</li>
   <li><b>Build</b> tab: own a whole colour group, then add up to 4 huts and a resort, evenly. Buildable squares glow on the board.</li>
   <li><b>Deals</b> tab: trade, or force a <b>buyout</b> of a partner's place for 2× its price if you already own part of that set. One per turn.</li>
   <li><b>Bank</b> tab: borrow up to ฿500 plus half of your places' value, 10% interest every time you pass Mingalaba. Mortgage places here too.</li>
   <li><b>Market</b> tab: SET stocks, Mogok rubies and gold. Prices move after every turn and on news. SET pays a 4% dividend at Mingalaba.</li>
   <li><b>Seasons</b>: rents rise to ×1.25 from round 7, ×1.5 from round 13 and ×2 from round 19.</li>
   <li><b>Festival mini-games</b> come up every 5–8 turns: place quiz, chinlone kicks or the ruby mine.</li>
   <li><b>Fortune Sticks</b> and <b>Merit Box</b> are the card decks. <b>Language moments</b> pay you both ฿50.</li>
   <li>Taxes fill the <b>Water Festival</b> pot. <b>Overstay!</b> sends you on a Visa Run: roll doubles, pay ฿50 or use a card.</li>
   <li>Out of money and nothing left to sell: game over. Or press <b>Finish &amp; count</b> to compare net worth.</li>
  </ul><div class="mbtns"><button class="btn" data-s="close">Got it</button></div></div></div>`}
function sheetAct(s,el){
  const i=el.dataset.i!=null?+el.dataset.i:null;
  if(s==="close"){const wasCard=openSheet&&openSheet.k==="card";closeSheet();
    if(wasCard&&S.phase==="buy"&&isMyTurn()){openSheet={k:"deed",i:S.players[S.turn].pos};renderSheets()}
    else if(wasCard&&S.phase==="challenge"&&isMyTurn()){openSheet={k:"chal"};renderSheets()}return}
  if(s==="buy"||s==="pass"){openSheet=null;renderSheets();commit(st=>doBuy(st,s==="buy"));if(s==="buy")sfx.coin();return}
  if(["build","sell","mort","unmort"].includes(s)){commit(st=>doManage(st,i,s)).then(()=>renderSheets());if(s==="build")sfx.coin();return}
  if(s==="buyout"){openSheet=null;renderSheets();commit(st=>doBuyout(st,i));sfx.coin();floatEmoji("💥");return}
  if(s==="chalyes"||s==="chalno"){openSheet=null;renderSheets();commit(st=>doChallenge(st,s==="chalyes"));if(s==="chalyes"){floatEmoji("💞");sfx.coin()}return}
  if(s==="qpick"){mg={kind:"quiz",pick:i};if(i===S.mini.q){sfx.coin();floatEmoji("🎉")}else sfx.pay();renderSheets();return}
  if(s==="dig"){mg={kind:"ruby",pick:i};const v=S.mini.mines[i];v?sfx.coin():sfx.pay();if(v===200)floatEmoji("💎");renderSheets();return}
  if(s==="kick"){if(!mg||mg.kicks>=3)return;const hit=mg.x>=mg.zone.l&&mg.x<=mg.zone.l+mg.zone.w;mg.kicks++;if(hit){mg.hits++;sfx.coin()}else sfx.pay();
    toast(hit?"Nice kick! 🏐":"Missed…");
    if(mg.kicks<3){mg.zone=newZone(mg.kicks);placeZone();const m=$("#chmsg");if(m)m.textContent=`Kick ${mg.kicks+1} of 3 · hits: ${mg.hits}`}
    else{stopChin();mg.live=false;renderSheets()}return}
  if(s==="mdone"){const amt=+el.dataset.amt||0,txt=el.dataset.txt||"played";stopChin();mg=null;openSheet=null;dismissed["m"+S.log.length]=1;renderSheets();commit(st=>doMini(st,amt,txt));if(amt)floatEmoji("🎪");return}
  if(s==="confirm"){const go=openSheet.go;openSheet=null;renderSheets();go();return}
  if(s==="sendtrade"){const ov=$("#overlay");const give=[...ov.querySelectorAll('input[name="give"]:checked')].map(x=>+x.value),get=[...ov.querySelectorAll('input[name="get"]:checked')].map(x=>+x.value);
    const gc=Math.max(0,Math.floor(+$("#tr-gc").value||0)),tc=Math.max(0,Math.floor(+$("#tr-tc").value||0));
    if(!give.length&&!get.length&&!gc&&!tc){toast("Pick something to trade first.");return}
    if(gc>S.players[S.turn].cash){toast("You don't have that much cash.");return}
    openSheet=null;renderSheets();
    commit(st=>{st.trade={id:Date.now(),from:st.turn,give,get,giveCash:gc,getCash:tc};L(st,`${st.players[st.turn].name} offered a trade.`)});
    return}
  if(s==="accept"||s==="decline"){const acc=s==="accept";const t=S.trade;openSheet=null;
    if(t)dismissed["t"+t.id]=1;renderSheets();
    if(acc&&t&&t.getCash>S.players[1-t.from].cash){toast("You don't have enough cash for this deal.");}
    if(localMode)commit(st=>applyTrade(st,acc));
    else db.doc("game/answer").set({id:t.id,accept:acc}).catch(e=>toast("Couldn't answer: "+(e.code||e.message)));
    return}
}
function toast(msg){const w=$("#toasts");const t=document.createElement("div");t.className="toast";t.textContent=msg;w.appendChild(t);setTimeout(()=>t.remove(),4200);while(w.children.length>3)w.firstChild.remove()}

/* ================= SETUP / LOBBY ================= */
let localSeats=[{name:"",tok:"🦚"},{name:"",tok:"🪆"}];
const draft={};
function seatInfo(k){return window.online&&!localMode?(lobby.seats[k]||null):localSeats[k]}
function setupView(){
  const online=window.online&&!localMode;
  const mine=k=>online&&lobby.seats[k]&&lobby.seats[k].uid===me;
  const iHave=online&&[0,1].some(mine);
  const picker=(k,tok,used)=>`<div class="tokpick">${TOKENS.map(([e,n])=>`<button data-tok="${e}" data-k="${k}" aria-pressed="${e===tok}" ${used.includes(e)?"disabled":""}>${e}<span>${n}</span></button>`).join("")}</div>`;
  const seat=k=>{
    const st=seatInfo(k);
    const used=[0,1].filter(j=>j!==k).map(j=>seatInfo(j)&&seatInfo(j).tok);
    const tok=(st&&st.tok)||(k?"🪆":"🦚");
    let body;
    if(online&&!st){body=iHave?`<p class="small">Waiting for your partner to open this page and take this seat.</p>`:
      `<input id="nm${k}" placeholder="Your name" maxlength="18" aria-label="Name for player ${k+1}">${picker(k,tok,used)}<button class="btn" data-claim="${k}">Take this seat</button>`}
    else if(online&&!mine(k)){body=`<div class="pl" style="--c:${COLORS[k]};grid-template-columns:auto 1fr"><div class="av">${st.tok}</div><div class="n">${esc(st.name)}</div></div><p class="small"><span class="dot ${peersOnline.has(k)?"on":""}"></span> Seat taken</p>`}
    else{body=`<input id="nm${k}" placeholder="${k?"e.g. Ilia":"e.g. Su"}" maxlength="18" value="${esc(st&&st.name||"")}" aria-label="Name for player ${k+1}">${picker(k,tok,used)}${online?`<div class="row"><span class="small">This is you.</span><button class="btn ghost sm" data-leave="${k}">Leave seat</button></div>`:""}`}
    return `<div class="card seat" style="border-color:${COLORS[k]}55"><div class="eyebrow" style="color:${COLORS[k]}">Player ${k+1}</div>${body}</div>`};
  const bothOnline=online&&lobby.seats[0]&&lobby.seats[1];
  const canStart=!online||(bothOnline&&iHave);
  const hasLocal=(()=>{try{const g=JSON.parse(store.get(LOCAL_KEY)||"null");return g&&g.v===VERSION&&g.phase!=="over"}catch(e){return false}})();
  return `<div class="setup">
   <div class="hero"><h1>Golden Land</h1><div class="sub">A property game of Thailand &amp; Myanmar for two</div><div class="scripts"><span class="mm">မင်္ဂလာပါ</span> · <span class="th">สวัสดี</span> · Привет</div></div>
   ${window.online?`<div class="mode"><button class="btn ${localMode?"ghost":""}" data-mode="online">Each on own phone</button><button class="btn ${localMode?"":"ghost"}" data-mode="local">Both on this device</button></div>`:`<p class="small" style="text-align:center">Online play needs the claude.ai version of this page. Here you play together on this one device.</p>`}
   <div class="seats">${seat(0)}${seat(1)}</div>
   <div style="text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-start ${canStart?"":"disabled"} style="font-size:17px;padding:.8em 2em">Start the journey</button>
   ${!online&&hasLocal?`<button class="btn ghost" data-resume style="font-size:17px;padding:.8em 2em">Resume saved game</button>`:""}</div>
   ${online&&!bothOnline?`<p class="small" style="text-align:center">Send this page to your partner. When you have both taken a seat, either of you can start.</p>`:""}
   <div class="how">
     <div class="card"><h2>22 real places</h2><p>Eleven in Thailand, eleven in Myanmar, from Hpa-An to the Grand Palace, with names in Thai and Burmese script.</p></div>
     <div class="card"><h2>More than rent</h2><p>Buyouts, bank loans, a market of SET stocks, rubies and gold, and seasons that push rents up as the game goes on.</p></div>
     <div class="card"><h2>Made for two</h2><p>Language moments, festival mini-games, live reactions. Open the same link on two phones, or share one screen.</p></div>
   </div></div>`}
function bindSetup(){
  const root=$("#root");const online=window.online&&!localMode;
  root.querySelectorAll("input[id^=nm]").forEach(inp=>{const k=+inp.id.slice(2);if(draft["n"+k]!=null&&!inp.value)inp.value=draft["n"+k];inp.addEventListener("input",()=>draft["n"+k]=inp.value)});
  [0,1].forEach(k=>{if(draft["t"+k]&&!(online&&lobby.seats[k]))root.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.tok===draft["t"+k]))});
  root.querySelectorAll("[data-tok]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(online){if(lobby.seats[k]&&lobby.seats[k].uid===me){saveSeat(k,{tok:b.dataset.tok})}else{draft["t"+k]=b.dataset.tok;root.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b))}}
    else{localSeats[k].name=$("#nm"+k).value;localSeats[k].tok=b.dataset.tok;render()}});
  root.querySelectorAll("input[id^=nm]").forEach(inp=>{const k=+inp.id.slice(2);inp.onchange=()=>{if(online){if(lobby.seats[k]&&lobby.seats[k].uid===me)saveSeat(k,{name:inp.value.trim()||("Player "+(k+1))})}else localSeats[k].name=inp.value}});
  root.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>{const k=+b.dataset.claim;const nm=$("#nm"+k).value.trim();
    const sel=root.querySelector(`[data-k="${k}"][aria-pressed="true"]`);
    if(!nm){toast("Type your name first.");$("#nm"+k).focus();return}
    saveSeat(k,{uid:me,name:nm,tok:sel?sel.dataset.tok:(k?"🪆":"🦚")})});
  root.querySelectorAll("[data-leave]").forEach(b=>b.onclick=()=>saveSeat(+b.dataset.leave,null));
  root.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{localMode=b.dataset.mode==="local";render()});
  const rs=root.querySelector("[data-resume]");if(rs)rs.onclick=()=>{if(loadLocal()){localMode=true;render()}};
  const st=root.querySelector("[data-start]");if(st)st.onclick=startGame;
}
async function saveSeat(k,patch){
  const cur=lobby.seats[k];const next=patch===null?null:Object.assign({},cur||{},patch);
  lobby.seats[k]=next;render();
  try{const ref=db.doc("game/lobby");const sn=await ref.get();
    if(sn.exists)await ref.update({seats:{[k]:next}});else await ref.set({seats:{[k]:next}})}
  catch(e){toast("Couldn't save your seat ("+(e.code||e.message)+"). The owner needs to share this page with you as an Editor.")}
}
function startGame(){
  if(localMode||!window.online){
    [0,1].forEach(k=>{const el=$("#nm"+k);if(el)localSeats[k].name=el.value.trim()});
    if(localSeats[0].tok===localSeats[1].tok){toast("Pick two different tokens.");return}
    localMode=true;S=newGame(localSeats.map((s,k)=>({name:s.name||("Player "+(k+1)),tok:s.tok})));seen=0;store.set(LOCAL_KEY,JSON.stringify(S));sfx.gong();render();return}
  const seats=[0,1].map(k=>lobby.seats[k]);
  if(!seats[0]||!seats[1]){toast("Both seats need a player.");return}
  if(seats[0].tok===seats[1].tok){toast("Pick two different tokens.");return}
  const s=newGame(seats);s.turn=s.first=Math.random()<.5?0:1;L(s,`${s.players[s.turn].name} goes first.`);
  S=s;seen=0;sfx.gong();render();
  db.doc("game/current").set(s).catch(e=>toast("Couldn't start: "+(e.code||e.message)));
}

boot();
</script>
